<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111719">
  <meta name="description" content="HALF-LIFE² — A low-poly first-person fan campaign.">
  <title>HALF-LIFE²</title>
  <link rel="icon" href="assets/lambda.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=campaign-2">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <main id="gameRoot">
    <section id="startScreen" class="screen start-screen" style="position:absolute;inset:0;z-index:20;display:block;overflow:hidden;background:#21142a">
      <img class="menu-backdrop" src="assets/xen-menu.webp" alt="" aria-hidden="true" draggable="false" onload="if(this.getAttribute('src').endsWith('.webp')){const b=document.getElementById('startButton');b.classList.add('image-hit-area');b.style.left='39.5%';b.style.top='71.2%';b.style.transform='none';b.style.width='21%';b.style.height='8.8%';b.style.padding='0';b.style.border='0';b.style.background='transparent';b.style.boxShadow='none';b.style.color='transparent';b.style.opacity='0'}" onerror="this.onerror=null;this.src='assets/xen-menu.svg'" style="position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none">
      <div class="menu-brand">
        <img class="lambda-logo" src="assets/lambda.svg" alt="Lambda">
        <h1 class="menu-title">HALF-LIFE<sup>2</sup></h1>
      </div>
      <button id="startButton" class="menu-start-button" type="button" aria-label="Start game" onclick="if(window.__startGame){window.__startGame()}else{window.__showBootError(this)}" style="position:absolute;z-index:3;left:50%;top:74.5%;transform:translate(-50%,-50%);width:min(410px,82vw);height:64px;left:50%;top:74.5%;transform:translate(-50%,-50%);padding:0;border:2px solid #b97832;background:rgba(16,10,21,.94);box-shadow:0 7px 28px rgba(0,0,0,.42);color:#ff982e;opacity:1;cursor:pointer;pointer-events:auto;touch-action:manipulation">START GAME</button>
    </section>

    <section id="hud" class="hud">
      <div class="mission-readout">
        <h2 id="objectiveTitle">Etsi kulkukortti</h2>
        <p id="objectiveDetail">Vartijan pöydältä.</p>
        <div class="progress-track"><span id="progressFill"></span></div>
      </div>
      <div id="crosshair" class="crosshair"><i></i><i></i><i></i><i></i></div>
      <div id="interactionPrompt" class="interaction-prompt"><kbd>E</kbd><span id="promptLabel"></span></div>
      <div id="subtitles" class="subtitles">
        <div class="subtitle-copy"><strong id="subtitleName">VALVOMO</strong><p id="subtitleText"></p></div>
      </div>
      <div class="hud-bottom">
        <div class="health-card">
          <span class="health-symbol">+</span>
          <div class="health-readout"><strong id="healthValue">100</strong><small>HP</small></div>
          <div class="health-track"><span id="healthFill"></span></div>
        </div>
        <div class="weapon-stack">
          <div id="weaponLabel" class="weapon-label"><strong id="weaponName">Sorkkarauta</strong></div>
          <div id="ammoReadout" class="ammo-readout hidden"><strong id="ammoValue">18</strong><small>9 MM</small></div>
        </div>
      </div>
      <div id="toast" class="toast"></div><div id="hitFlash" class="hit-flash"></div>
    </section>

    <section id="pauseScreen" class="screen modal-screen hidden">
      <div class="modal-panel">
        <div class="menu-cap">KALLIO RESEARCH ANNEX</div>
        <h2>KESKEYTETTY</h2>
        <button id="resumeButton" class="primary-button">JATKA</button>
        <button id="pauseQuitButton" class="secondary-button">ALOITA ALUSTA</button>
        <div class="modal-foot">ESC — JATKA</div>
      </div>
    </section>

    <section id="endScreen" class="screen modal-screen hidden">
      <div class="modal-panel">
        <div class="menu-cap">KALLIO RESEARCH ANNEX</div>
        <h2 id="endTitle">SEKTORI 09</h2>
        <p id="endDescription"></p>
        <strong id="endTime" class="end-time"></strong>
        <button id="retryButton" class="primary-button">PELAA UUDELLEEN</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const saveError = (reason) => {
        const detail = reason && (reason.stack || reason.message || String(reason));
        window.__bootError = String(detail || 'Tuntematon latausvirhe').slice(0, 700);
        console.error('Game startup error:', window.__bootError);
      };
      window.addEventListener('error', (event) => {
        if (event.target && event.target.tagName === 'SCRIPT') {
          saveError('Moduulin lataus epäonnistui: ' + (event.target.src || 'inline script'));
        } else saveError(event.error || event.message);
      }, true);
      window.addEventListener('unhandledrejection', (event) => saveError(event.reason));
      window.__showBootError = (button) => {
        const message = window.__bootError || 'Pelin käynnistysmoduuli ei latautunut. Päivitä sivu Ctrl+Shift+R.';
        button.textContent = 'LOAD ERROR';
        button.style.opacity = '1';
        button.style.color = '#ff982e';
        button.style.background = 'rgba(16,10,21,.94)';
        button.style.border = '2px solid #b97832';
        button.title = message;
        console.error('Game failed to load:', message);
      };
    })();
  </script>
  <script type="module" src="src/main.js" onerror="window.__bootError = window.__bootError || 'src/main.js tai sen moduuli ei latautunut';"></script>
</body>
</html>
